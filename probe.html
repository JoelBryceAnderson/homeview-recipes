<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Device probe</title>
<style>
:root{--bg:#f2f2f7;--card:#fff;--ink:#1c1c1e;--muted:#8e8e93;--line:#e5e5ea;--ok:#248a3d;--bad:#d70015;--warn:#b25000;--accent:#b0263b}
@media (prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--ink:#f2f2f7;--muted:#98989d;--line:#38383a;--ok:#30d158;--bad:#ff453a;--warn:#ff9f0a;--accent:#ff6b81}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;padding:14px 16px 40px}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin:0 0 10px}
h2{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:16px 0 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 12px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td{padding:4px 0;border-bottom:1px solid var(--line);vertical-align:top;word-break:break-word}
tr:last-child td{border-bottom:0}
td:first-child{color:var(--muted);width:44%;padding-right:8px}
.ok{color:var(--ok);font-weight:600}.bad{color:var(--bad);font-weight:600}.warn{color:var(--warn);font-weight:600}
.btns{display:flex;gap:8px;flex-wrap:wrap}
button{height:38px;padding:0 16px;border:0;border-radius:19px;background:var(--accent);color:#fff;font:600 14px/1 -apple-system,system-ui,sans-serif}
button.alt{background:transparent;color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.big{font-size:26px;font-weight:700;text-align:center;padding:4px 0}
#msg{color:var(--muted);font-size:13px;min-height:1.3em;margin-top:6px}
</style>
</head><body>
<h1>Device probe</h1>
<p class="sub">What this browser can see. Tap the buttons, shake the screen, then Copy report.</p>
<div class="btns">
<button id="bMotion">Allow motion</button>
<button id="bWake" class="alt">Test wake lock</button>
<button id="bSensor" class="alt">Test sensors</button>
<button id="bCopy">Copy report</button>
</div>
<div id="msg"></div>

<h2>Motion (live)</h2>
<div class="card"><div class="big" id="shakes">Shakes: 0</div><table data-s="motion"></table></div>
<h2>Orientation (live)</h2><div class="card"><table data-s="orient"></table></div>
<h2>Sensor APIs</h2><div class="card"><table data-s="sensors"></table></div>
<h2>Permissions</h2><div class="card"><table data-s="perms"></table></div>
<h2>Media devices</h2><div class="card"><table data-s="media"></table></div>
<h2>Web features</h2><div class="card"><table data-s="feat"></table></div>
<h2>Screen &amp; display</h2><div class="card"><table data-s="screen"></table></div>
<h2>Device &amp; browser</h2><div class="card"><table data-s="device"></table></div>

<script>
const R={};const $=id=>document.getElementById(id);
const f=v=>v==null?'—':typeof v==='number'?(Number.isInteger(v)?String(v):v.toFixed(2)):String(v);
function set(sec,key,val,cls){(R[sec]=R[sec]||{})[key]=val;const t=document.querySelector('[data-s="'+sec+'"]');let tr=[...t.rows].find(r=>r.dataset.k===key);
 if(!tr){tr=t.insertRow();tr.dataset.k=key;tr.insertCell().textContent=key;tr.insertCell()}const c=tr.cells[1];c.textContent=typeof val==='boolean'?(val?'yes':'no'):f(val);
 c.className=cls||(val===true?'ok':val===false?'bad':'')}
const msg=t=>{$('msg').textContent=t};
const has=(o,k)=>{try{return k in o}catch(_){return false}};
const mm=q=>matchMedia(q).matches;

// device & browser
const n=navigator;
set('device','User agent',n.userAgent);
set('device','Platform',n.platform||'—');
set('device','Vendor',n.vendor||'—');
set('device','Languages',(n.languages||[n.language]).join(', '));
set('device','Time zone',Intl.DateTimeFormat().resolvedOptions().timeZone);
set('device','CPU cores',n.hardwareConcurrency??'—');
set('device','Device memory (GB)',n.deviceMemory??'—');
set('device','Standalone (home screen app)',!!n.standalone||mm('(display-mode: standalone)'));
set('device','Online',n.onLine);
if(n.connection)set('device','Connection',[n.connection.effectiveType,n.connection.downlink&&n.connection.downlink+' Mb/s'].filter(Boolean).join(', '));
if(n.userAgentData)n.userAgentData.getHighEntropyValues(['model','platformVersion','architecture']).then(v=>{set('device','UA model',v.model||'—');set('device','UA platform version',v.platformVersion||'—')}).catch(()=>{});
try{const gl=document.createElement('canvas').getContext('webgl');const d=gl&&gl.getExtension('WEBGL_debug_renderer_info');
 set('device','GPU',gl?(d?gl.getParameter(d.UNMASKED_RENDERER_WEBGL):gl.getParameter(gl.RENDERER)):'no WebGL');
 set('device','WebGL2',!!document.createElement('canvas').getContext('webgl2'))}catch(e){set('device','GPU','error: '+e.message,'bad')}
if(n.storage&&n.storage.estimate)n.storage.estimate().then(e=>set('device','Storage quota',e.quota?Math.round(e.quota/1e6)+' MB':'—')).catch(()=>{});
if(n.getBattery)n.getBattery().then(b=>set('device','Battery',Math.round(b.level*100)+'%'+(b.charging?' charging':''))).catch(()=>{});

// screen
const scr=()=>{set('screen','Viewport',innerWidth+' × '+innerHeight);set('screen','Screen',screen.width+' × '+screen.height);
 set('screen','Available',screen.availWidth+' × '+screen.availHeight);set('screen','devicePixelRatio',devicePixelRatio);
 set('screen','Orientation',screen.orientation?screen.orientation.type+' '+screen.orientation.angle+'°':(window.orientation??'—'))};scr();addEventListener('resize',scr);
set('screen','maxTouchPoints',n.maxTouchPoints);
set('screen','Pointer',mm('(pointer: coarse)')?'coarse':mm('(pointer: fine)')?'fine':'none');
set('screen','Hover',mm('(hover: hover)'));
set('screen','Any fine pointer',mm('(any-pointer: fine)'));
set('screen','Colour scheme',mm('(prefers-color-scheme: dark)')?'dark':'light');
set('screen','Reduced motion',mm('(prefers-reduced-motion: reduce)'));
set('screen','Reduced transparency',mm('(prefers-reduced-transparency: reduce)'));
set('screen','More contrast',mm('(prefers-contrast: more)'));
set('screen','Inverted colours',mm('(inverted-colors: inverted)'));
set('screen','Colour gamut',mm('(color-gamut: rec2020)')?'rec2020':mm('(color-gamut: p3)')?'p3':'srgb');
set('screen','HDR',mm('(dynamic-range: high)'));
set('screen','Refresh rate','measuring…');
{let k=0,t0=0;const tick=t=>{if(!t0)t0=t;if(++k<60)requestAnimationFrame(tick);else set('screen','Refresh rate',Math.round(59000/(t-t0))+' Hz')};requestAnimationFrame(tick)}
{const d=document.createElement('div');d.style.cssText='position:fixed;top:env(safe-area-inset-top);left:env(safe-area-inset-left);right:env(safe-area-inset-right);bottom:env(safe-area-inset-bottom);visibility:hidden';document.body.appendChild(d);
 const cs=getComputedStyle(d);set('screen','Safe area (t r b l)',[cs.top,cs.right,cs.bottom,cs.left].join(' '));d.remove()}

// features
const W=window;
[['DeviceMotionEvent',has(W,'DeviceMotionEvent')],['DeviceMotion requestPermission',has(W,'DeviceMotionEvent')&&typeof DeviceMotionEvent.requestPermission==='function'],
 ['DeviceOrientationEvent',has(W,'DeviceOrientationEvent')],['Screen Wake Lock',has(n,'wakeLock')],['Speech recognition',has(W,'SpeechRecognition')||has(W,'webkitSpeechRecognition')],
 ['Speech synthesis',has(W,'speechSynthesis')],['getUserMedia',!!(n.mediaDevices&&n.mediaDevices.getUserMedia)],['Geolocation',has(n,'geolocation')],
 ['Notifications',has(W,'Notification')],['Push',has(W,'PushManager')],['Service worker',has(n,'serviceWorker')],['Web Share',has(n,'share')],
 ['Clipboard write',!!(n.clipboard&&n.clipboard.writeText)],['Vibration',has(n,'vibrate')],['Battery API',has(n,'getBattery')],['Gamepad',has(n,'getGamepads')],
 ['Web Bluetooth',has(n,'bluetooth')],['WebUSB',has(n,'usb')],['Web NFC',has(W,'NDEFReader')],['Web Serial',has(n,'serial')],['WebHID',has(n,'hid')],
 ['WebXR',has(n,'xr')],['WebGPU',has(n,'gpu')],['Web Audio',has(W,'AudioContext')||has(W,'webkitAudioContext')],['Web Speech voices',has(W,'speechSynthesis')?(speechSynthesis.getVoices().length||'loading'):'—'],
 ['Apple Pay',has(W,'ApplePaySession')],['Picture in picture',has(document,'pictureInPictureEnabled')],['Fullscreen API',has(document.documentElement,'requestFullscreen')||has(document.documentElement,'webkitRequestFullscreen')],
 ['View transitions',has(document,'startViewTransition')],['Screen orientation lock',!!(screen.orientation&&screen.orientation.lock)],['Idle detection',has(W,'IdleDetector')],
 ['Eye dropper',has(W,'EyeDropper')],['Contact picker',has(n,'contacts')],['Credential mgmt',has(n,'credentials')],['Web Authn',has(W,'PublicKeyCredential')]
].forEach(([k,v])=>set('feat',k,v));
if(has(W,'speechSynthesis'))speechSynthesis.onvoiceschanged=()=>set('feat','Web Speech voices',speechSynthesis.getVoices().length);

// sensor APIs
['Accelerometer','LinearAccelerationSensor','GravitySensor','Gyroscope','Magnetometer','AbsoluteOrientationSensor','RelativeOrientationSensor','AmbientLightSensor','ProximitySensor'].forEach(k=>set('sensors',k,has(W,k)));
set('sensors','devicelight event',has(W,'ondevicelight'));
set('sensors','deviceproximity event',has(W,'ondeviceproximity'));
set('sensors','userproximity event',has(W,'onuserproximity'));

// permissions
if(n.permissions&&n.permissions.query){['accelerometer','gyroscope','magnetometer','ambient-light-sensor','camera','microphone','geolocation','notifications','screen-wake-lock','clipboard-read'].forEach(p=>
 n.permissions.query({name:p}).then(r=>{set('perms',p,r.state,r.state==='granted'?'ok':r.state==='denied'?'bad':'warn');r.onchange=()=>set('perms',p,r.state)}).catch(()=>set('perms',p,'not supported','')))}
else set('perms','Permissions API',false);

// media devices (no prompt; labels hidden until permission)
if(n.mediaDevices&&n.mediaDevices.enumerateDevices)n.mediaDevices.enumerateDevices().then(ds=>{const c={};ds.forEach(d=>c[d.kind]=(c[d.kind]||0)+1);
 ['videoinput','audioinput','audiooutput'].forEach(k=>set('media',k,c[k]||0,(c[k]?'ok':'bad')));set('media','labels visible',ds.some(d=>d.label))}).catch(e=>set('media','error',e.message,'bad'));
else set('media','enumerateDevices',false);

// motion
let cnt=0,t0=0,last=0,iv=0,lastE=null,maxD=0,maxA=0,maxR=0,pg=null,spikes=[],shakes=0,on=false;const recent=[];
const xyz=o=>o&&o.x!=null?[o.x,o.y,o.z].map(f).join(' / '):'null';
function onMotion(e){cnt++;const now=performance.now();if(!t0)t0=now;iv=e.interval||(last?now-last:0);last=now;lastE=e;
 const g=e.accelerationIncludingGravity,a=e.acceleration,r=e.rotationRate;
 if(a&&a.x!=null)maxA=Math.max(maxA,Math.hypot(a.x,a.y,a.z));if(r&&r.alpha!=null)maxR=Math.max(maxR,Math.hypot(r.alpha,r.beta,r.gamma));
 const s=g&&g.x!=null?g:a&&a.x!=null?a:null;
 if(s){if(pg){const d=Math.hypot(s.x-pg.x,s.y-pg.y,s.z-pg.z);recent.push([now,d]);maxD=Math.max(maxD,d);
  if(d>7){spikes=spikes.filter(x=>now-x<900);if(!spikes.length||now-spikes[spikes.length-1]>80)spikes.push(now);
   if(spikes.length>=3){spikes=[];shakes++;$('shakes').textContent='Shakes: '+shakes;R.motion=R.motion||{};R.motion.shakes=shakes;document.body.animate([{transform:'translateX(-8px)'},{transform:'translateX(8px)'},{transform:'none'}],{duration:240})}}}
  pg={x:s.x,y:s.y,z:s.z}}}
let ocnt=0;function onOrient(e){ocnt++;set('orient','events',ocnt,'ok');set('orient','alpha / beta / gamma',[e.alpha,e.beta,e.gamma].map(f).join(' / '));set('orient','absolute',!!e.absolute);
 if(e.webkitCompassHeading!=null)set('orient','compass heading',e.webkitCompassHeading)}
set('orient','events',0,'bad');
function start(){if(on)return;on=true;addEventListener('devicemotion',onMotion);addEventListener('deviceorientation',onOrient)}
function tick(){const now=performance.now();while(recent.length&&now-recent[0][0]>2000)recent.shift();const e=lastE;
 set('motion','listening',on);set('motion','events received',cnt,cnt?'ok':'bad');
 set('motion','rate',cnt>1&&last>t0?((cnt-1)/((last-t0)/1000)).toFixed(1)+' Hz':'—');set('motion','interval (ms)',iv);
 set('motion','acceleration',e?xyz(e.acceleration):'—');set('motion','incl. gravity',e?xyz(e.accelerationIncludingGravity):'—');
 set('motion','rotationRate',e&&e.rotationRate&&e.rotationRate.alpha!=null?[e.rotationRate.alpha,e.rotationRate.beta,e.rotationRate.gamma].map(f).join(' / '):'null');
 set('motion','biggest jolt, last 2 s',recent.reduce((m,r)=>Math.max(m,r[1]),0));set('motion','biggest jolt ever',maxD);
 set('motion','max |acceleration|',maxA);set('motion','max rotation (°/s)',maxR);setTimeout(tick,150)}
tick();
const needPerm=has(W,'DeviceMotionEvent')&&typeof DeviceMotionEvent.requestPermission==='function';
$('bMotion').onclick=()=>{if(needPerm){DeviceMotionEvent.requestPermission().then(r=>{set('motion','permission',r,r==='granted'?'ok':'bad');if(r==='granted')start();msg(r==='granted'?'Motion allowed. Shake the screen.':'Motion '+r+'.')}).catch(e=>{set('motion','permission','error: '+e.message,'bad')});
  if(has(W,'DeviceOrientationEvent')&&typeof DeviceOrientationEvent.requestPermission==='function')DeviceOrientationEvent.requestPermission().then(r=>set('orient','permission',r,r==='granted'?'ok':'bad')).catch(()=>{})}
 else{set('motion','permission','not needed','ok');start();msg('Listening. Shake the screen.')}};
if(!needPerm)start();
setTimeout(()=>{if(on&&!cnt)set('motion','note','no events after 3 s while listening','warn')},3000);

// wake lock test
$('bWake').onclick=async()=>{if(!n.wakeLock){set('feat','Wake lock test','not supported','bad');return}
 try{const l=await n.wakeLock.request('screen');set('feat','Wake lock test','acquired','ok');msg('Wake lock on for 5 s.');setTimeout(()=>l.release(),5000)}catch(e){set('feat','Wake lock test','error: '+e.message,'bad')}};

// generic sensor test
$('bSensor').onclick=()=>{msg('Starting sensors…');['Accelerometer','Gyroscope','AmbientLightSensor','LinearAccelerationSensor','Magnetometer'].forEach(k=>{
 if(!has(W,k)){set('sensors',k+' test','not available','');return}
 try{const s=new W[k]({frequency:10});let got=false;
  s.onreading=()=>{got=true;set('sensors',k+' test',k==='AmbientLightSensor'?Math.round(s.illuminance)+' lux':[s.x,s.y,s.z].map(f).join(' / '),'ok')};
  s.onerror=e=>set('sensors',k+' test',(e.error&&e.error.name)+': '+(e.error&&e.error.message),'bad');s.start();
  setTimeout(()=>{if(!got)set('sensors',k+' test','no readings','warn')},3000)}
 catch(e){set('sensors',k+' test',e.name+': '+e.message,'bad')}})};

// copy
$('bCopy').onclick=async()=>{const txt=JSON.stringify({when:new Date().toISOString(),...R},null,1);
 try{await n.clipboard.writeText(txt);msg('Report copied. Paste it to me.')}catch(_){const ta=document.createElement('textarea');ta.value=txt;ta.style.cssText='width:100%;height:200px;margin-top:8px';$('msg').after(ta);ta.select();msg('Copy the text below.')}};
</script>
</body></html>
